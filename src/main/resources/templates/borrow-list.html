<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Borrow Records</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <div th:replace="~{fragments :: navbar}"></div>
    <h1>Library - Borrow Records</h1>

    <a href="/books" class="btn btn-outline-secondary mb-3">Books</a>
    <a href="/members" class="btn btn-outline-secondary mb-3">Members</a>
    <a href="/borrow/add" class="btn btn-primary mb-3">+ Borrow a Book</a>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Book</th>
                <th>Member</th>
                <th>Borrow Date</th>
                <th>Due Date</th>
                <th>Return Date</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="record : ${records}">
                <td th:text="${record.book.title}"></td>
                <td th:text="${record.member.name}"></td>
                <td th:text="${record.borrowDate}"></td>
                <td th:text="${record.dueDate}"></td>
                <td th:text="${record.returnDate}"></td>
                <td>
                    <span th:if="${record.returned}" class="badge bg-success">Returned</span>
                    <span th:unless="${record.returned}" class="badge bg-warning text-dark">Borrowed</span>
                </td>
                <td>
                    <a th:unless="${record.returned}"
                       th:href="@{/borrow/return/{id}(id=${record.id})}"
                       class="btn btn-sm btn-success">Return</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
