<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Library Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <div th:replace="~{fragments :: navbar}"></div>

    <div class="p-5 mb-4 bg-light rounded-3 shadow text-center">
        <h1>📚 Welcome to the Library Management System</h1>
        <p class="text-muted">Manage books, members, and borrow records — all in one place.</p>
        <hr>
        <div class="d-flex justify-content-center gap-3 mt-4">
            <a href="/books" class="btn btn-primary btn-lg">View Books</a>
            <a href="/members" class="btn btn-success btn-lg">View Members</a>
            <a href="/borrow" class="btn btn-warning btn-lg">Borrow Records</a>
        </div>
    </div>

</body>
</html>
