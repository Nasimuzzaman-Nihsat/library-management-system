<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Member List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <div th:replace="~{fragments :: navbar}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <h1>Library - Member List</h1>

    <a href="/books" class="btn btn-outline-secondary mb-3">Books</a>
    <a href="/members/add" class="btn btn-primary mb-3">+ Add New Member</a>
    <a href="/borrow" class="btn btn-outline-secondary mb-3">Borrow Records</a>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="member : ${members}">
                <td th:text="${member.name}"></td>
                <td th:text="${member.email}"></td>
                <td th:text="${member.phone}"></td>
                <td>
                    <a th:href="@{/members/edit/{id}(id=${member.id})}" class="btn btn-sm btn-warning">Edit</a>
                    <a th:href="@{/members/delete/{id}(id=${member.id})}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Are you sure you want to delete this member?');">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
