<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Borrow a Book</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <div th:replace="~{fragments :: navbar}"></div>
    <h1>Borrow a Book</h1>

    <form th:action="@{/borrow/save}" method="post">

        <div class="mb-3">
            <label>Select Book</label>
            <select name="bookId" class="form-control" required>
                <option th:each="book : ${books}"
                th:value="${book.id}"
                th:text="${book.title} + ' (Available: ' + ${book.quantity} + ')'"></option>
            </select>
        </div>

        <div class="mb-3">
            <label>Select Member</label>
            <select name="memberId" class="form-control" required>
                <option th:each="member : ${members}"
                        th:value="${member.id}"
                        th:text="${member.name}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label>Borrow Duration (days)</label>
            <input type="number" name="days" value="14" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-success">Confirm Borrow</button>
        <a href="/borrow" class="btn btn-secondary">Cancel</a>

    </form>

</body>
</html>
